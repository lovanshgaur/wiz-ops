<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the strip</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="strip-section" id="strip">
            <div class="section-header">
                <h4>Our Process</h4>
                <h2>From initial concept to production scale.</h2>
            </div>
            <div class="section-main">
                <div class="strips-wrapper">
                    <div class="card-wrapper">
                        <div class="card" data-id="1"></div>
                    </div>
                    <div class="card-wrapper">
                        <div class="card" data-id="2"></div>
                    </div>
                    <div class="card-wrapper">
                        <div class="card" data-id="3"></div>
                    </div>
                    <div class="card-wrapper">
                        <div class="card" data-id="4"></div>
                    </div>
                </div>
                <div class="strip-profile">
                    <div class="strip-profile-wrapper">
                        <div class="profile-card">
                            <img class="profile-image"
                                src="https://images.unsplash.com/photo-1556075798-4825dfaaf498?w=1200&auto=format&fit=crop&q=80"
                                alt="">
                        </div>
                        <div class="progress-bar">
                            <div id="progress"></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
