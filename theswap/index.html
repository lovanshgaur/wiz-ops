<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Swap - WizOps27</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero" id="hero-wrap">

        <div class="hero-background hero-section"></div>
        <div class="hero-overlay hero-section"></div>

        <div class="hero-body hero-section">

            <div class="hero-nav hero-container"></div>

            <div class="hero-main hero-container">
                <div class="hero-text"></div>
                <div class="hero-profile"></div>
            </div>

            <div class="hero-footer hero-container">
                <div class="slide-controls">
                    <button class="slide-button" id="prev">←</button>
                    <button class="slide-button" id="next">→</button>
                </div>
            </div>
        </div>

    </header>
    <main></main>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
